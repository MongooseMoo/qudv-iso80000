[project]
name = "qudv-iso80000"
version = "0.1.0"
description = "Convert the OMG SysML QUDV ISO-80000 model library to quantity kinds, dimensions and units in YAML"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "lxml>=6.0.2",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
