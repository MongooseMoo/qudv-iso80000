[project]
name = "qudv-iso80000"
version = "0.1.0"
description = "Convert the OMG SysML QUDV ISO-80000 model library to quantity kinds, dimensions and units in YAML"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "lxml>=6.0.2",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=8",
    "types-lxml>=2026.2.16",
    "types-pyyaml>=6.0.12.20250915",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pyright]
include = ["iso80000_converter.py", "dependency_resolution.py", "tests"]
pythonVersion = "3.9"
typeCheckingMode = "standard"
strict = ["dependency_resolution.py"]
reportUnnecessaryTypeIgnoreComment = "error"
