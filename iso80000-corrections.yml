    - '-1'
  - - ISO-80000.package_packagedElement_ISO80000-4_Mechanics.package_packagedElement_Units.package_packagedElement_pascal_second.instanceSpecification_packagedElement_pascal_second
    - '1'
  reason: Correct the kinematic-viscosity unit to divide by density, consistently with the corrected quantity definition.
  citation: https://www.nist.gov/pml/special-publication-811/nist-guide-si-chapter-8
- target: ISO-80000.package_packagedElement_ISO80000-4_Mechanics.package_packagedElement_Units.package_packagedElement_pascal_second_kilogram_per_cubic_metre.instanceSpecification_packagedElement_pascal_second_kilogram_per_cubic_metre
  field: name
  expected: pascal second kilogram per cubic metre
  value: pascal second cubic metre per kilogram
  reason: Rename the corrected kinematic-viscosity unit to express reciprocal density; its prefixed units follow. The original name and symbol stay in declarations.
  citation: https://www.nist.gov/pml/special-publication-811/nist-guide-si-chapter-8
- target: ISO-80000.package_packagedElement_ISO80000-4_Mechanics.package_packagedElement_Units.package_packagedElement_pascal_second_kilogram_per_cubic_metre.instanceSpecification_packagedElement_pascal_second_kilogram_per_cubic_metre
  field: symbol
  expected: m^2/s
  value: Pa.s.m^3/kg
  reason: Rename the corrected kinematic-viscosity unit to express reciprocal density; its prefixed units follow. The original name and symbol stay in declarations.
  citation: https://www.nist.gov/pml/special-publication-811/nist-guide-si-chapter-8
- target: ISO-80000.package_packagedElement_ISO80000-3_Space_and_Time.package_packagedElement_Units.package_packagedElement_litre.instanceSpecification_packagedElement_litre
  field: scale
  expected: 1/10
  value: 1/1000
  reason: The litre is one cubic decimetre, 10^-3 m^3; the source applies the deci prefix to the cubic metre, giving 10^-1 m^3. Prefixed litres chain through this unit.
  citation: https://www.bipm.org/en/publications/si-brochure
- target: ISO-80000.package_packagedElement_ISO80000-5_Thermodynamics.package_packagedElement_Quantities.package_packagedElement_isentropic_exponent.instanceSpecification_packagedElement_isentropic_exponent
  field: factors
  expected:
  - - ISO-80000.package_packagedElement_ISO80000-5_Thermodynamics.package_packagedElement_Quantities.package_packagedElement_pressure_per_volume_increase_at_constant_entropy.instanceSpecification_packagedElement_pressure_per_volume_increase_at_constant_entropy
    - '-1'
  - - ISO-80000.package_packagedElement_ISO80000-5_Thermodynamics.package_packagedElement_Quantities.package_packagedElement_volume_per_pressure_in_a_reference_state.instanceSpecification_packagedElement_volume_per_pressure_in_a_reference_state
    - '1'
  value:
  - - ISO-80000.package_packagedElement_ISO80000-5_Thermodynamics.package_packagedElement_Quantities.package_packagedElement_pressure_per_volume_increase_at_constant_entropy.instanceSpecification_packagedElement_pressure_per_volume_increase_at_constant_entropy
    - '1'
  - - ISO-80000.package_packagedElement_ISO80000-5_Thermodynamics.package_packagedElement_Quantities.package_packagedElement_volume_per_pressure_in_a_reference_state.instanceSpecification_packagedElement_volume_per_pressure_in_a_reference_state
    - '1'
  reason: Isentropic exponent is -(V/p)(dp/dV) at constant entropy, a quantity of dimension one (source section 5-17.2); the source inverts the pressure-per-volume factor, giving L^8 M^-2 T^4.
  citation: https://www.omg.org/spec/SysML/20150709/ISO-80000.xmi
- target: ISO-80000.package_packagedElement_ISO80000-5_Thermodynamics.package_packagedElement_Units.package_packagedElement_cubic_metre_per_pascal_ratio.instanceSpecification_packagedElement_cubic_metre_per_pascal_ratio
  field: factors
  expected:
  - - ISO-80000.package_packagedElement_ISO80000-5_Thermodynamics.package_packagedElement_Units.package_packagedElement_cubic_metre_per_pascal.instanceSpecification_packagedElement_cubic_metre_per_pascal
    - '1'
  - - ISO-80000.package_packagedElement_ISO80000-5_Thermodynamics.package_packagedElement_Units.package_packagedElement_pascal_per_cubic_metre.instanceSpecification_packagedElement_pascal_per_cubic_metre
    - '-1'
  value:
  - - ISO-80000.package_packagedElement_ISO80000-5_Thermodynamics.package_packagedElement_Units.package_packagedElement_cubic_metre_per_pascal.instanceSpecification_packagedElement_cubic_metre_per_pascal
    - '1'
  - - ISO-80000.package_packagedElement_ISO80000-5_Thermodynamics.package_packagedElement_Units.package_packagedElement_pascal_per_cubic_metre.instanceSpecification_packagedElement_pascal_per_cubic_metre
    - '1'
  reason: Correct the isentropic-exponent unit to the product (m^3/Pa)(Pa/m^3), dimension one, consistently with the corrected quantity definition; the source divides instead.
  citation: https://www.omg.org/spec/SysML/20150709/ISO-80000.xmi
- target: ISO-80000.package_packagedElement_IEC80000-6_Electromagnetism.package_packagedElement_Quantities.package_packagedElement_electric_field_strength.instanceSpecification_packagedElement_electric_field_strength
  field: factors
  expected:
  - - ISO-80000.package_packagedElement_IEC80000-6_Electromagnetism.package_packagedElement_Quantities.package_packagedElement_electric_charge.instanceSpecification_packagedElement_electric_charge
    - '1'
  - - ISO-80000.package_packagedElement_ISO80000-4_Mechanics.package_packagedElement_Quantities.package_packagedElement_force.instanceSpecification_packagedElement_force
    - '1'
  value:
  - - ISO-80000.package_packagedElement_IEC80000-6_Electromagnetism.package_packagedElement_Quantities.package_packagedElement_electric_charge.instanceSpecification_packagedElement_electric_charge
    - '-1'
  - - ISO-80000.package_packagedElement_ISO80000-4_Mechanics.package_packagedElement_Quantities.package_packagedElement_force.instanceSpecification_packagedElement_force
    - '1'
  reason: Electric field strength is force per charge. The factor instance is named 'electric charge^-1' but its exponent slot says 1; with the slot, field strength, potential, flux, power and every kind built on them disagree with their own units.
  citation: https://www.omg.org/spec/SysML/20150709/ISO-80000.xmi
- target: ISO-80000.package_packagedElement_IEC80000-6_Electromagnetism.package_packagedElement_Quantities.package_packagedElement_initial_phase_of_electric_current.instanceSpecification_packagedElement_initial_phase_of_electric_current
  field: factors
  expected:
  - - ISO-80000.package_packagedElement_IEC80000-6_Electromagnetism.package_packagedElement_Quantities.package_packagedElement_electric_current.instanceSpecification_packagedElement_electric_current
    - '1'
  value: []
  reason: An initial phase is an angle; the source flags this kind as dimension one but also gives it the factor electric current^1, which names the quantity whose phase it is.
  citation: https://www.omg.org/spec/SysML/20150709/ISO-80000.xmi
- target: ISO-80000.package_packagedElement_IEC80000-6_Electromagnetism.package_packagedElement_Quantities.package_packagedElement_initial_phase_of_electric_voltage.instanceSpecification_packagedElement_initial_phase_of_electric_voltage
  field: factors
  expected:
  - - ISO-80000.package_packagedElement_IEC80000-6_Electromagnetism.package_packagedElement_Quantities.package_packagedElement_voltage.instanceSpecification_packagedElement_voltage
    - '1'
  value: []
  reason: An initial phase is an angle; the source flags this kind as dimension one but also gives it the factor voltage^1, which names the quantity whose phase it is.
  citation: https://www.omg.org/spec/SysML/20150709/ISO-80000.xmi
- target: ISO-80000.package_packagedElement_ISO80000-9_Physical_Chemestry_and_Molecular_Physics.package_packagedElement_Quantities.package_packagedElement_amount_of_substance.instanceSpecification_packagedElement_amount_of_substance
  field: entity_count
  expected: true
  value: false
  reason: Amount of substance is an ISQ base quantity of dimension N, distinct from the dimension-one number of entities; the source also sets isNumberOfEntities on it.
